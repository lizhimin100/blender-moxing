<style>
  :root { --bg:#0f1115; --panel:#15181f; --line:#262b36; --txt:#e8eaef; --dim:#8b93a3; --accent:#c9a227; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--txt); overflow:hidden;
    font:13px/1.6 "Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  #view { position:fixed; inset:0; }
  #bar { position:fixed; left:16px; top:16px; z-index:5; background:rgba(21,24,31,.92);
    border:1px solid var(--line); border-radius:8px; padding:10px 12px; backdrop-filter:blur(6px); }
  #bar h1 { margin:0 0 8px; font-size:12px; letter-spacing:.12em; color:var(--accent); font-weight:600; }
  .row { display:flex; gap:6px; margin-bottom:6px; }
  .row:last-child { margin-bottom:0; }
  button { background:#1b1f28; color:var(--txt); border:1px solid var(--line); border-radius:5px;
    padding:6px 10px; font:inherit; font-size:12px; cursor:pointer; }
  button:hover { border-color:#3b4457; background:#1f2431; }
  button.on { border-color:var(--accent); background:#221f14; color:#f0d98a; }
  #hud { position:fixed; left:16px; bottom:16px; z-index:5; color:var(--dim); font-size:11px;
    font-family:ui-monospace,Consolas,monospace; background:rgba(21,24,31,.85);
    border:1px solid var(--line); border-radius:6px; padding:6px 9px; white-space:pre; }
  #tip { position:fixed; right:16px; bottom:16px; z-index:5; color:var(--dim); font-size:11px; }
</style>
</head>

const hudEl = document.getElementById('hud');
function fatal(msg) {
  hudEl.textContent = '⚠ ' + msg;
  hudEl.style.color = '#ff9c8a';
}
addEventListener('error', (e) => fatal(e.message || '脚本错误'));
addEventListener('unhandledrejection', (e) => fatal((e.reason && e.reason.message) || 'Promise 拒绝'));

const Q = new URLSearchParams(location.search);
let current = MODELS[Q.get('m')] ? Q.get('m') : 'bs_low';

// ---------- 渲染器 ----------
const host = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#10131a');
scene.fog = new THREE.Fog('#10131a', 46, 96);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 400);
camera.position.set(14, 12, 18);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 3;
controls.maxDistance = 70;

// ---------- 灯光（与出图脚本同一思路：暖主光 + 冷补光 + 半球环境）----------
scene.add(new THREE.HemisphereLight('#a9c0e0', '#4a4033', 1.0));
const key = new THREE.DirectionalLight('#fff2dc', 2.6);
key.position.set(-16, 24, -16);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
const sc = 16;
Object.assign(key.shadow.camera, { left: -sc, right: sc, top: sc, bottom: -sc, near: 1, far: 90 });
key.shadow.camera.updateProjectionMatrix();
key.shadow.bias = -0.0006;
scene.add(key);
const fill = new THREE.DirectionalLight('#9fb8ff', 0.75);
fill.position.set(18, 10, 14);
scene.add(fill);
const rim = new THREE.DirectionalLight('#ffd9a8', 0.5);
rim.position.set(4, 7, 20);
scene.add(rim);

// ---------- 地面 ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(60, 64),
  new THREE.MeshStandardMaterial({ color: '#3b4034', roughness: 1, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(60, 60, '#3a4352', '#2a3040');
grid.position.y = 0.002;
grid.material.transparent = true;
grid.material.opacity = 0.35;
scene.add(grid);

// ---------- 载入 ----------
const loader = new GLTFLoader();
let root = null;
let box0 = new THREE.Box3();
const hud = document.getElementById('hud');
const wireBtns = document.getElementById('wire');
let wireOn = false;

function frame(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const ctr = box.getCenter(new THREE.Vector3());
  const r = Math.max(size.x, size.y, size.z) * 0.5;
  const dist = r / Math.tan((camera.fov * Math.PI) / 360) * 1.55;
  controls.target.copy(ctr);
  camera.position.set(ctr.x - dist * 0.62, ctr.y + dist * 0.55, ctr.z - dist * 0.72);
  camera.near = Math.max(0.1, dist / 120);
  camera.far = dist * 12;
  camera.updateProjectionMatrix();
  controls.update();
}

function countTris(obj) {
  let t = 0;
  obj.traverse((o) => {
    if (o.isMesh && o.geometry) {
      const g = o.geometry;
      t += g.index ? g.index.count / 3 : g.attributes.position.count / 3;
    }
  });
  return Math.round(t);
}

async function load(key) {
  if (!MODELS[key]) return;
  current = key;
  document.querySelectorAll('#bar button[data-m]').forEach((b) =>
    b.classList.toggle('on', b.dataset.m === key)
  );
  const m = MODELS[key];
  hud.textContent = `载入 ${m.name} · ${m.kind} …`;
  if (root) { scene.remove(root); disposeTree(root); root = null; }
  try {
    const gltf = await loader.loadAsync(encodeURI(m.file));
    root = gltf.scene;
    root.traverse((o) => {
      if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
    });
    scene.add(root);
    if (!box0.isEmpty() === false) box0 = new THREE.Box3().setFromObject(root);
    frame(root);
    const tris = countTris(root);
    const size = new THREE.Box3().setFromObject(root).getSize(new THREE.Vector3());
    hud.textContent =
      `${m.name} · ${m.kind}\n` +
      `${tris.toLocaleString()} 三角面\n` +
      `${size.x.toFixed(2)} × ${size.z.toFixed(2)} × ${size.y.toFixed(2)} m`;
    history.replaceState(null, '', `?m=${key}`);
  } catch (e) {
    hud.textContent = '载入失败：' + (e?.message || e) + '\n（必须用 HTTP 打开，不能双击）';
    console.error(e);
  }
}

function disposeTree(obj) {
  obj.traverse((o) => {
    if (o.isMesh) {
      o.geometry?.dispose?.();
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach((mm) => mm?.dispose?.());
    }
  });
}

document.querySelectorAll('#bar button[data-m]').forEach((b) => {
  b.onclick = () => load(b.dataset.m);
});
wireBtns.onclick = () => {
  wireOn = !wireOn;
  wireBtns.classList.toggle('on', wireOn);
  root?.traverse((o) => { if (o.isMesh && o.material) o.material.wireframe = wireOn; });
};
let spin = false;
document.getElementById('spin').onclick = (e) => {
  spin = !spin;
  e.currentTarget.classList.toggle('on', spin);
};
document.getElementById('reset').onclick = () => root && frame(root);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  if (spin && root) root.rotation.y += 0.004;
  controls.update();
  renderer.render(scene, camera);
});

load(current);
</script>
</body>
</html>
